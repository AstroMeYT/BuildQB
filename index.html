<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Packet Builder</title>
<style>
:root{color-scheme:dark;--bg:#14161b;--pan:#1d2027;--ink:#e6e8ec;--mut:#98a0ad;--ac:#5b8def;--ln:#343a46}[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;gap:18px;padding:0 18px;height:52px;background:var(--pan);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:10}
header h1{font-size:16px;margin:0}
#steps{display:flex;gap:4px;margin:0 auto;height:100%}#steps button{border:0;background:none;font:inherit;font-size:14px;color:var(--mut);padding:0 18px;cursor:pointer;border-bottom:2px solid transparent;height:100%}#steps button:hover{color:var(--ink)}#steps button.on{color:#8fb2ff;border-color:var(--ac);font-weight:600}
.b{font:inherit;padding:7px 13px;border:1px solid var(--ln);background:#272b34;border-radius:8px;cursor:pointer;color:var(--ink)}
.b:hover{background:#323844}.b.p{background:var(--ac);border-color:var(--ac);color:#fff}.b.p:hover{background:#6e9bf5}
.b.s{padding:3px 9px;font-size:13px}.b:disabled{opacity:.5;cursor:wait}
.step{display:none}.step.on{display:block}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px 60px}
.panel{background:var(--pan);border:1px solid var(--ln);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.panel h2{margin:0 0 4px;font-size:16px}.panel p.sub{margin:0 0 12px;color:var(--mut);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label.f{display:block;margin:0 0 11px;font-size:13px;color:var(--mut)}
label.f input:not([type=checkbox]),label.f select,dialog input,dialog textarea{display:block;width:100%;margin-top:3px;padding:7px 9px;font:inherit;color:var(--ink);border:1px solid var(--ln);border-radius:7px;background:#12141a}
label.c{display:flex;gap:8px;align-items:center;margin:0 0 9px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--ln);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13px;user-select:none}
.chip:has(input:checked){background:#1f2b47;border-color:var(--ac);color:#b8cdff}
.chip input{display:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end}.sp{flex:1}
#st{color:var(--mut);font-size:13px;margin-top:10px;min-height:18px}
.card{background:var(--pan);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.card .tg{font-size:12px;color:var(--mut);display:flex;gap:8px;align-items:center}
.card p{margin:6px 0}.card .an{color:#7fd9a0;font-size:13px;margin:2px 0 6px}.card .pt{margin:4px 0 0}
.card .ac{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.badge{background:#2a2e38;border-radius:5px;padding:1px 7px;font-weight:600;color:var(--ink)}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
.foot{display:flex;gap:8px;margin-top:6px}
/* document step */
#s3{height:calc(100vh - 52px)}#s3.on{display:grid;grid-template-columns:330px 1fr}
#ctl{background:var(--pan);border-right:1px solid var(--ln);padding:14px;overflow:auto}
#ctl h3{margin:14px 0 8px;font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{padding:9px 6px;border:1px solid var(--ln);background:var(--pan);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer;text-align:left}
.seg button small{display:block;color:var(--mut);font-size:11.5px}
.seg button.on{border-color:var(--ac);background:#1f2b47;box-shadow:inset 0 0 0 1px var(--ac)}
#prev{overflow:auto;min-width:0}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:9px 16px;background:var(--pan);border-bottom:1px solid var(--ln)}
.bar span{color:var(--mut);font-size:13px}
#pages{padding:18px 16px 30px}
.page{background:#fff;color:#000;margin:0 auto 18px;box-shadow:0 2px 14px rgba(0,0,0,.65);display:flex;flex-direction:column;overflow:hidden}
.ph{font-size:.8em;color:#555;border-bottom:1px solid #bbb;padding-bottom:4pt;margin-bottom:8pt}.ph:empty{display:none}
.pb{flex:1;min-height:0;overflow:hidden}
.pf{text-align:center;font-size:.8em;color:#444;padding-top:6pt;min-height:1.4em}
.q{margin-top:var(--gap)}.q:first-child{margin-top:0}.q p{margin:0 0 .25em}
.an{font-weight:bold}.nb .an{font-weight:normal}
.mt{font-size:.8em;color:#555;font-style:italic}
.sec{font-weight:bold;font-size:1.25em;border-bottom:1px solid #000;padding-bottom:2pt}
.ti{font-size:1.9em;font-weight:bold;line-height:1.15}.st{font-size:1.1em;color:#333;margin-top:3pt}
/* layouts */
.cp .q p{margin:0 0 .1em}.cp .sec{font-size:1.1em;border:0;text-transform:uppercase;letter-spacing:.04em}.cp .ti{font-size:1.4em}.cp .st{font-size:1em}
.rd .q:not(.sec):not(.hd){border-left:3px solid #c5d0ea;padding:2pt 0 2pt 10pt}
.rd .an{background:#eff3fb;padding:2pt 7pt;border-radius:3pt;display:inline-block;margin-top:2pt}
.rd .sec{border-bottom:2px solid #2a3f7a;color:#2a3f7a;padding-bottom:4pt}.rd .ti{color:#1c2a52}
.rd .ph{border-color:#c5d0ea}
dialog{background:var(--pan);color:var(--ink);border:0;border-radius:12px;padding:18px;width:min(580px,94vw);max-height:90vh;box-shadow:0 10px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.65)}dialog label{display:block;font-size:13px;color:var(--mut);margin-bottom:8px}dialog h3{margin:0 0 10px}
dialog .card{box-shadow:none}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#e6e8ec;color:#14161b;padding:8px 14px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:99}
#toast.on{opacity:1}
@media(max-width:860px){#steps b+span{display:none}#s3.on{display:block;height:auto}#ctl{border:0}.two{grid-template-columns:1fr}}
@media print{
 body{background:#fff}header,#ctl,.bar,#toast,.step:not(#s3){display:none!important}
 #s3.on{display:block;height:auto}#prev{overflow:visible}#pages{padding:0;zoom:1!important}
 .page{box-shadow:none;margin:0;break-after:page}.page:last-child{break-after:auto}
}
</style></head>
<body>
<header><h1>Packet Builder</h1>
 <div id="steps"></div><span style="width:110px"></span></header>

<section class="step" id="s1"><div class="wrap">
 <div class="panel"><h2>How many questions?</h2><p class="sub">Questions are pulled at random from QBReader.</p>
  <div class="two"><label class="f">Tossups<input type="number" id="nt" min="0" max="50" value="20"></label>
  <label class="f">Bonuses<input type="number" id="nb" min="0" max="50" value="20"></label></div></div>
 <div class="panel"><h2>Genres</h2><p class="sub">Leave all unselected to include every genre.</p><div class="chips" id="cats"></div></div>
 <div class="panel"><h2>Difficulty levels</h2><p class="sub">Leave all unselected to include every level.</p><div class="chips" id="diffs"></div></div>
 <div class="panel"><label class="c"><input type="checkbox" id="rep" checked> Replace the questions I already have</label>
  <div class="row"><button class="b p" id="go">Generate questions</button><button class="b" id="skip">Continue with current questions</button></div><div id="st"></div></div>
</div></section>

<section class="step" id="s2"><div class="wrap">
 <div class="row" style="margin-bottom:14px"><h2 style="margin:0;font-size:17px" id="qcount"></h2><span class="sp"></span>
  <button class="b" id="addT">+ Tossup</button><button class="b" id="addB">+ Bonus</button><button class="b" id="dedupe">Remove duplicates</button><button class="b" id="favs">★ Favorites</button></div>
 <div id="qlist"></div>
 <div class="foot"><button class="b" data-go="1">← Generate</button><span class="sp"></span><button class="b p" data-go="3">Layout →</button></div>
</div></section>

<section class="step" id="s3">
 <div id="ctl"><div id="layp"><div class="seg" id="seg"></div><div id="lay"></div><div class="row" style="margin-top:14px"><button class="b" data-go="2">← Edit</button><span class="sp"></span><button class="b p" data-go="4">Export →</button></div></div><div id="exp" hidden><h3 style="margin:0 0 4px;font-size:16px">Export</h3><p id="estat" style="color:var(--mut);margin:0 0 14px;font-size:13px"></p><div style="display:grid;gap:8px"><button class="b p" id="print">Print / Save PDF</button><button class="b" id="share">Share</button><button class="b" id="copy">Copy text</button><button class="b" id="dl">Download .txt</button></div><p style="color:var(--mut);font-size:12.5px;margin-top:14px">In the print dialog, choose Save as PDF and turn off headers and footers.</p><div class="row" style="margin-top:14px"><button class="b" data-go="3">← Layout</button></div></div></div>
 <div id="prev"><div class="bar"><span id="pc"></span><span class="sp"></span><span>Zoom</span><input type="range" id="zoom" min="40" max="130" value="75" style="width:100px"></div>
 <div id="pages"></div></div>
</section>
<dialog id="dlg"></dialog><div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=s=>String(s??'').replace(/<[^>]+>/g,'');
const CATS=['Literature','History','Science','Fine Arts','Religion','Mythology','Philosophy','Social Science','Current Events','Geography','Other Academic','Trash'];
const DIFFS=[[1,'Middle school'],[2,'Easy HS'],[3,'Regular HS'],[4,'Hard HS'],[5,'National HS'],[6,'Easy college'],[7,'Regular college'],[8,'Hard college'],[9,'College nationals'],[10,'Open']];
const FONTS=['Georgia','Times New Roman','Palatino Linotype','Garamond','Arial','Verdana','Calibri','Courier New','system-ui'];
const PRESETS={
 compact:{font:'Times New Roman',size:10,lh:1.15,gap:5,margin:.5,meta:false,hdr:false,keep:false,bold:true,answers:'inline',order:'group'},
 readable:{font:'Georgia',size:12,lh:1.5,gap:16,margin:1,meta:true,hdr:true,keep:true,bold:true,answers:'inline',order:'group'}};
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
let Q=LS('qbpc2.q')||[],favs=LS('qbpc2.fav')||[],step=1;
const S={title:'Practice Packet',sub:'',paper:'Letter',pb:false,pnum:true,layout:'readable',...PRESETS.readable,...(LS('qbpc2.s')||{})};
if(!(LS('qbpc2.s')||{}).order&&S.group===false)S.order='list';delete S.group;
const persist=()=>{LS('qbpc2.s',S);LS('qbpc2.q',Q);LS('qbpc2.fav',favs)};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)};

/* steps */
const STEPS=['Generate','Edit','Layout','Export'];
function go(n){step=n;const sec=n>3?3:n;document.querySelectorAll('.step').forEach((s,i)=>s.classList.toggle('on',i+1===sec));
 $('#steps').innerHTML=STEPS.map((l,i)=>`<button data-n="${i+1}" class="${i+1===n?'on':''}">${l}</button>`).join('');
 if(n===2)list();if(n>=3){$('#layp').hidden=n===4;$('#exp').hidden=n!==4;paginate()}window.scrollTo(0,0)}
$('#steps').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.n)};
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(+b.dataset.go)});

/* duplicate detection */
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const qkey=q=>q.type+':'+norm(q.type==='t'?q.text:q.leadin+' '+q.parts.join(' ')).slice(0,90);
const hasText=q=>qkey(q).length>8;
function uniq(arr,seen){const out=[];for(const q of arr){const k=qkey(q);if(hasText(q)&&seen.has(k))continue;seen.add(k);out.push(q)}return out}
const isDup=(q,i)=>hasText(q)&&Q.findIndex(x=>qkey(x)===qkey(q))<i;

/* step 1 */
$('#cats').innerHTML=CATS.map(c=>`<label class="chip"><input type="checkbox" value="${c}">${c}</label>`).join('');
$('#diffs').innerHTML=DIFFS.map(([v,l])=>`<label class="chip"><input type="checkbox" value="${v}">${v} · ${l}</label>`).join('');
const checked=s=>[...document.querySelectorAll(s+' input:checked')].map(i=>i.value);
async function fetchQ(kind,n){
 const p=new URLSearchParams({number:n}),c=checked('#cats'),d=checked('#diffs');
 if(c.length)p.set('categories',c.join(','));if(d.length)p.set('difficulties',d.join(','));
 const r=await fetch(`https://www.qbreader.org/api/random-${kind}?${p}`);
 if(!r.ok)throw new Error('QBReader returned '+r.status);
 const j=await r.json();return j[kind==='tossup'?'tossups':'bonuses']||[];
}
const src=x=>[x.set?.name,x.packet?.number?'Packet '+x.packet.number:'',x.questionNumber?'#'+x.questionNumber:''].filter(Boolean).join(' ');
const toT=t=>({type:'t',text:strip(t.question_sanitized??t.question),ans:strip(t.answer_sanitized??t.answer),cat:t.category,sub:t.subcategory,diff:t.difficulty,src:src(t)});
const toB=b=>({type:'b',leadin:strip(b.leadin_sanitized??b.leadin),parts:(b.parts_sanitized??b.parts??[]).map(strip),answers:(b.answers_sanitized??b.answers??[]).map(strip),values:b.values||[10,10,10],cat:b.category,sub:b.subcategory,diff:b.difficulty,src:src(b)});
$('#go').onclick=async()=>{
 const nt=Math.min(50,+$('#nt').value||0),nb=Math.min(50,+$('#nb').value||0),btn=$('#go');
 if(!nt&&!nb)return($('#st').textContent='Enter at least one tossup or bonus.');
 btn.disabled=true;$('#st').textContent='Fetching from qbreader.org…';
 try{
  const base=$('#rep').checked?[]:Q,seen=new Set(base.filter(hasText).map(qkey));
  let T=[],B=[],dup=0;
  for(let tries=0;tries<4&&(T.length<nt||B.length<nb);tries++){
   const [rt,rb]=await Promise.all([T.length<nt?fetchQ('tossup',nt-T.length):[],B.length<nb?fetchQ('bonus',nb-B.length):[]]);
   const a=rt.map(toT),b=rb.map(toB),u1=uniq(a,seen),u2=uniq(b,seen);
   dup+=a.length+b.length-u1.length-u2.length;T.push(...u1);B.push(...u2);
  }
  Q=[...base,...T,...B];persist();
  toast(`Added ${T.length} tossups and ${B.length} bonuses.`+(dup?` Skipped ${dup} duplicate${dup>1?'s':''}.`:'')+((T.length<nt||B.length<nb)?' Fewer unique questions matched your filters than requested.':''));
  go(2);
 }catch(e){$('#st').textContent='Could not reach QBReader: '+e.message+'. Check your connection and try again.'}
 btn.disabled=false;
};
$('#skip').onclick=()=>go(2);

/* step 2 */
const metaOf=q=>[(q.cat||'')+(q.sub?' – '+q.sub:''),q.diff!=null?'Difficulty '+q.diff:'',q.src].filter(Boolean).join(' | ');
function btn(l,t,fn,cls=''){const b=document.createElement('button');b.className='b s '+cls;b.textContent=l;b.title=t;b.onclick=fn;return b}
function card(q,i){
 const d=document.createElement('div');d.className='card';
 const n=Q.slice(0,i+1).filter(x=>x.type===q.type).length;
 d.innerHTML=`<div class="tg"><span class="badge">${q.type==='t'?'Tossup':'Bonus'} ${n}</span>${isDup(q,i)?'<span class="badge" style="background:#5a2a2a;color:#ffb4b4">Duplicate</span>':''}${h(metaOf(q))}</div>`+(q.type==='t'?`<p>${h(q.text)}</p><p class="an">ANSWER: ${h(q.ans)}</p>`
  :`<p>${h(q.leadin)}</p>`+q.parts.map((p,k)=>`<p class="pt">[${q.values?.[k]??10}] ${h(p)}</p><p class="an">ANSWER: ${h(q.answers[k])}</p>`).join(''));
 const a=document.createElement('div');a.className='ac';d.append(a);
 const isFav=q.fid&&favs.some(f=>f.fid===q.fid);
 const mv=k=>()=>{const j=i+k;if(j<0||j>=Q.length)return;[Q[i],Q[j]]=[Q[j],Q[i]];persist();list()};
 a.append(btn(isFav?'★':'☆','Favorite',()=>{if(isFav)favs=favs.filter(f=>f.fid!==q.fid);else{q.fid=q.fid||'f'+Date.now()+Math.random().toString(36).slice(2,6);favs.push(JSON.parse(JSON.stringify(q)))}persist();list();toast(isFav?'Removed from favorites':'Saved to favorites')}),
  btn('↑','Move up',mv(-1)),btn('↓','Move down',mv(1)),
  btn('Edit','Edit',()=>edit(q,()=>{const f=favs.find(f=>f.fid===q.fid);if(f)Object.assign(f,JSON.parse(JSON.stringify(q)));persist();list()})),
  btn('Delete','Delete',()=>{Q.splice(i,1);persist();list()}));
 return d;
}
function list(){
 const el=$('#qlist');el.innerHTML='';
 const t=Q.filter(q=>q.type==='t').length;
 $('#qcount').textContent=`${t} tossups, ${Q.length-t} bonuses`;
 if(!Q.length){el.innerHTML='<div class="empty">No questions yet. Go back to Setup to generate some, or add your own.</div>';return}
 Q.forEach((q,i)=>el.append(card(q,i)));
}
const blank=t=>t==='t'?{type:'t',text:'',ans:'',cat:'Custom'}:{type:'b',leadin:'',parts:['','',''],answers:['','',''],values:[10,10,10],cat:'Custom'};
const addNew=t=>{const q=blank(t);edit(q,()=>{if(hasText(q)&&Q.some(x=>qkey(x)===qkey(q)))toast('This matches a question you already have');Q.push(q);persist();list()})};
$('#dedupe').onclick=()=>{const n=Q.length;Q=uniq(Q,new Set());persist();list();toast(n>Q.length?`Removed ${n-Q.length} duplicate${n-Q.length>1?'s':''}`:'No duplicates found')};
$('#addT').onclick=()=>addNew('t');$('#addB').onclick=()=>addNew('b');
function edit(q,done){
 const t=q.type==='t',dlg=$('#dlg');
 const f=(id,l,v,ta)=>`<label>${l}${ta?`<textarea id="${id}" rows="4">${h(v)}</textarea>`:`<input id="${id}" value="${h(v)}">`}</label>`;
 dlg.innerHTML=`<h3>${t?'Tossup':'Bonus'}</h3>`+(t?f('e0','Question',q.text,1)+f('e1','Answer',q.ans):f('e0','Lead-in',q.leadin,1)+q.parts.map((p,i)=>f('p'+i,'Part '+(i+1),p,1)+f('a'+i,'Answer '+(i+1),q.answers[i]||'')).join(''))+`<div class="row end"><button class="b" id="ec">Cancel</button><button class="b p" id="es">Save</button></div>`;
 $('#ec').onclick=()=>dlg.close();
 $('#es').onclick=()=>{const v=id=>$('#'+id).value.trim();
  if(t){q.text=v('e0');q.ans=v('e1')}else{q.leadin=v('e0');q.parts=q.parts.map((_,i)=>v('p'+i));q.answers=q.parts.map((_,i)=>v('a'+i))}
  dlg.close();done()};
 dlg.showModal();
}
$('#favs').onclick=()=>{
 const dlg=$('#dlg');dlg.innerHTML='<h3>Favorites</h3><div id="fl" style="max-height:60vh;overflow:auto"></div><div class="row end"><button class="b" id="ec">Close</button></div>';
 $('#ec').onclick=()=>dlg.close();
 const fl=$('#fl'),draw=()=>{fl.innerHTML='';if(!favs.length)fl.innerHTML='<div class="empty">Star a question to keep it here for later packets.</div>';
  favs.forEach(q=>{const d=document.createElement('div');d.className='card';
   d.innerHTML=`<div class="tg"><span class="badge">${q.type==='t'?'Tossup':'Bonus'}</span>${h(metaOf(q))}</div><p>${h((q.type==='t'?q.text:q.leadin).slice(0,180))}…</p><p class="an">${h(q.type==='t'?q.ans:q.answers.join(' / '))}</p>`;
   const a=document.createElement('div');a.className='ac';d.append(a);
   a.append(btn('Remove','Remove favorite',()=>{favs=favs.filter(f=>f!==q);persist();draw();list()}),btn('+ Add to packet','',()=>{if(hasText(q)&&Q.some(x=>qkey(x)===qkey(q)))return toast('Already in your questions');Q.push(JSON.parse(JSON.stringify(q)));persist();list();toast('Added to your questions')},'p'));
   fl.append(d)})};
 draw();dlg.showModal();
};

/* step 3: controls */
const SPEC=[['title','Title','text'],['sub','Subtitle','text'],['font','Font (whole document)','sel',FONTS],['size','Font size (pt)','num',[6,24,.5]],['lh','Line spacing','num',[1,2.5,.05]],['gap','Space between questions (pt)','num',[0,48,1]],['margin','Margins (in)','num',[.25,2,.05]],['paper','Paper size','sel',['Letter','A4']],['answers','Answers','sel',[['inline','After each question'],['end','Answer key at the end'],['none','Hide answers']]],['keep','Never split a question across pages','chk'],['order','Question order','sel',[['group','Tossups first, then bonuses'],['alt','Alternate tossup and bonus'],['list','Same order as the Edit page']]],['pb','Start bonuses on a new page','chk'],['meta','Show category, difficulty and source','chk'],['bold','Bold answer lines','chk'],['hdr','Running header','chk'],['pnum','Page numbers','chk']];
function ctl(){
 $('#seg').innerHTML=`<button data-l="compact" class="${S.layout==='compact'?'on':''}">Compact<small>Dense, like NAQT packets</small></button><button data-l="readable" class="${S.layout==='readable'?'on':''}">Readable<small>Roomy, clearly separated</small></button>`;
 $('#lay').innerHTML='<h3>Text and page</h3>'+SPEC.map(([k,l,t,o])=>{
  if(t==='chk')return`<label class="c"><input type="checkbox" data-k="${k}" ${S[k]?'checked':''}> ${l}</label>`;
  if(t==='sel')return`<label class="f">${l}<select data-k="${k}">${o.map(x=>{const[v,n]=Array.isArray(x)?x:[x,x];return`<option value="${v}" ${S[k]===v?'selected':''}>${n}</option>`}).join('')}</select></label>`;
  if(t==='num')return`<label class="f">${l}<input type="number" data-k="${k}" min="${o[0]}" max="${o[1]}" step="${o[2]}" value="${S[k]}"></label>`;
  return`<label class="f">${l}<input data-k="${k}" value="${h(S[k])}"></label>`}).join('');
}
$('#seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;Object.assign(S,PRESETS[b.dataset.l],{layout:b.dataset.l});persist();ctl();paginate()};
$('#lay').oninput=e=>{const k=e.target.dataset.k;if(!k)return;const el=e.target;
 S[k]=el.type==='checkbox'?el.checked:el.type==='number'?(el.value===''?S[k]:+el.value):el.value;persist();paginate()};
ctl();

/* step 3: document */
const an=a=>`<p class="an">ANSWER: ${h(a)}</p>`;
function order(){const T=Q.filter(q=>q.type==='t'),B=Q.filter(q=>q.type==='b');
 if(S.order==='group')return[...T,...B];
 if(S.order==='alt'){const o=[];for(let i=0;i<Math.max(T.length,B.length);i++){if(T[i])o.push(T[i]);if(B[i])o.push(B[i])}return o}
 return Q}
function units(){
 const T=Q.filter(q=>q.type==='t'),B=Q.filter(q=>q.type==='b'),seq=order(),G=S.order==='group';
 const U=[{hd:1,els:[`<div class="ti">${h(S.title)}</div>${S.sub?`<div class="st">${h(S.sub)}</div>`:''}`]}];
 let nt=0,nb=0,last='';
 for(const q of seq){
  if(G&&q.type!==last){last=q.type;U.push({head:1,brk:q.type==='b'&&S.pb&&T.length>0,els:[q.type==='t'?'Tossups':'Bonuses']})}
  const n=q.type==='t'?++nt:++nb,inl=S.answers==='inline';
  const parts=q.type==='t'?[`<p><b>${G?n+'.':(q.type==='t'?'Tossup ':'Bonus ')+n+'.'}</b> ${h(q.text)}</p>${inl?an(q.ans):''}`]
   :[`<p><b>${G?n+'.':(q.type==='t'?'Tossup ':'Bonus ')+n+'.'}</b> ${h(q.leadin)}</p>`,...q.parts.map((p,i)=>`<p>[${q.values?.[i]??10}] ${h(p)}</p>${inl?an(q.answers[i]):''}`)];
  if(S.meta&&metaOf(q))parts[parts.length-1]+=`<div class="mt">${h(metaOf(q))}</div>`;
  U.push({els:S.keep?[parts.join('')]:parts});
 }
 if(S.answers==='end'&&seq.length){
  U.push({head:1,brk:1,els:['Answer Key']});nt=nb=0;
  for(const q of seq)U.push({els:[q.type==='t'?`<p><b>Tossup ${++nt}.</b> ${h(q.ans)}</p>`:`<p><b>Bonus ${++nb}.</b> ${q.answers.map(h).join(' / ')}</p>`]});
 }
 return U;
}
let timer;
function paginate(){
 clearTimeout(timer);timer=setTimeout(()=>{
  if(step<3)return;
  const root=$('#pages'),A4=S.paper==='A4';
  root.innerHTML='';root.style.zoom=$('#zoom').value/100;
  let st=$('#pst');if(!st){st=document.createElement('style');st.id='pst';document.head.append(st)}
  st.textContent=`@page{size:${A4?'210mm 297mm':'8.5in 11in'};margin:0}.page{width:${A4?'210mm':'8.5in'};height:${A4?'297mm':'11in'};padding:${S.margin}in;font-family:"${S.font}",serif;font-size:${S.size}pt;line-height:${S.lh};--gap:${S.gap}pt}`;
  const cls=(S.layout==='compact'?'cp':'rd')+(S.bold?'':' nb');
  const mk=()=>{const p=document.createElement('div');p.className='page '+cls;p.innerHTML=`<div class="ph">${S.hdr?h(S.title):''}</div><div class="pb"></div><div class="pf"></div>`;root.append(p);return p.querySelector('.pb')};
  let body=mk();
  if(!Q.length)body.innerHTML='<p style="color:#777;text-align:center;margin-top:3in">No questions yet.<br>Go back and generate or add some.</p>';
  else for(const u of units()){
   if(u.brk&&body.children.length)body=mk();
   for(const html of u.els){
    const el=document.createElement('div');el.className='q'+(u.head?' sec':'')+(u.hd?' hd':'');if(u.hd)el.classList.remove('sec');
    el.innerHTML=html;body.append(el);
    if(body.scrollHeight>body.clientHeight+1&&body.children.length>1){
     const prev=el.previousElementSibling,mv=[el];
     if(prev&&prev.classList.contains('sec')&&!u.head)mv.unshift(prev);
     body=mk();mv.forEach(m=>body.append(m));
    }
   }
  }
  const pg=[...root.children];pg.forEach((p,i)=>p.querySelector('.pf').textContent=S.pnum?(i+1):'');
  $('#pc').textContent=Q.length?`${pg.length} page${pg.length>1?'s':''}`:'';$('#estat').textContent=Q.length?`${Q.filter(q=>q.type==='t').length} tossups, ${Q.filter(q=>q.type==='b').length} bonuses, ${pg.length} page${pg.length>1?'s':''}`:'No questions yet.';
 },40);
}
function asText(){
 const out=[S.title,S.sub,''];let nt=0,nb=0;
 const T=Q.filter(q=>q.type==='t'),B=Q.filter(q=>q.type==='b'),seq=order(),G=S.order==='group',ans=S.answers!=='none';
 for(const q of seq){
  if(q.type==='t')out.push(`${(G?'':'Tossup ')+(++nt)+'.'} ${q.text}`,...(ans?['ANSWER: '+q.ans]:[]),'');
  else out.push(`${(G?'':'Bonus ')+(++nb)+'.'} ${q.leadin}`,...q.parts.flatMap((p,i)=>[`[${q.values?.[i]??10}] ${p}`,...(ans?['ANSWER: '+q.answers[i]]:[])]),'');
 }
 return out.join('\n').trim();
}
$('#print').onclick=()=>{if(!Q.length)return toast('Add questions first');window.print()};
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(asText());toast('Packet text copied')}catch(e){toast('Copy was blocked by the browser')}};
$('#share').onclick=async()=>{
 if(!Q.length)return toast('Add questions first');
 if(navigator.share){try{await navigator.share({title:S.title,text:asText()})}catch(e){}}else $('#copy').click();
};
$('#dl').onclick=()=>{if(!Q.length)return toast('Add questions first');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([asText()],{type:'text/plain'}));a.download=(S.title||'packet').replace(/[^\w-]+/g,'-')+'.txt';a.click()};
$('#zoom').oninput=()=>$('#pages').style.zoom=$('#zoom').value/100;
go(1);
</script>
</body></html>
